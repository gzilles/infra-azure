name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/plan.yml"

# id-token: exigido pelo OIDC. Sem isso a Azure recusa o login.
permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  lint:
    name: fmt + lint + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: checkov
        run: |
          pipx install checkov
          checkov --directory . --framework terraform --quiet --compact --download-external-modules false

  plan:
    name: plan (${{ matrix.env }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            client_id_var: AZURE_CLIENT_ID_DEV
            subscription_id_var: AZURE_SUBSCRIPTION_ID_DEV
          - env: stg
            client_id_var: AZURE_CLIENT_ID_STG
            subscription_id_var: AZURE_SUBSCRIPTION_ID_STG
          - env: prd
            client_id_var: AZURE_CLIENT_ID_PRD
            subscription_id_var: AZURE_SUBSCRIPTION_ID_PRD

    env:
      ARM_CLIENT_ID: ${{ vars[matrix.client_id_var] }}
      ARM_SUBSCRIPTION_ID: ${{ vars[matrix.subscription_id_var] }}

    defaults:
      run:
        working-directory: envs/${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = sem mudanças, 2 = há mudanças, 1 = erro real
          if [ "$code" -eq 1 ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt

      - name: Comentar o plan no PR
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.env }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- tf-plan:${env} -->`;
            const limit = 60000;

            let plan = fs.readFileSync(`envs/${env}/plan.txt`, 'utf8');
            let truncated = '';
            if (plan.length > limit) {
              plan = plan.slice(0, limit);
              truncated = '\n\n> Saída truncada. Veja o log completo da execução.';
            }

            const changed = process.env.EXITCODE === '2';
            const header = changed
              ? `### \`${env}\` — mudanças pendentes`
              : `### \`${env}\` — nenhuma mudança`;

            const body = [
              marker,
              header,
              '',
              '<details><summary>terraform plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              truncated,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number }
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
