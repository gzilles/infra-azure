name: terraform-apply

# DESATIVADO: o tenant do Entra ID bloqueia registro de app por usuários
# comuns (sem papel Application Developer), então as identidades OIDC do
# bootstrap.sh não existem ainda. Rodando automaticamente, este workflow só
# falharia no login da Azure a cada merge. Para reativar, descomente o
# gatilho `push` abaixo depois que o bootstrap terminar de criar as
# identidades.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "envs/**"
  #     - "modules/**"
  #     - ".github/workflows/apply.yml"
  #     - ".github/workflows/_terraform-apply.yml"

# Um apply por vez no repositório inteiro; nunca cancelar no meio.
concurrency:
  group: tf-apply
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/_terraform-apply.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: dev
      client_id_var: AZURE_CLIENT_ID_DEV
      subscription_id_var: AZURE_SUBSCRIPTION_ID_DEV

  stg:
    needs: dev
    uses: ./.github/workflows/_terraform-apply.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: stg
      client_id_var: AZURE_CLIENT_ID_STG
      subscription_id_var: AZURE_SUBSCRIPTION_ID_STG

  prd:
    needs: stg
    uses: ./.github/workflows/_terraform-apply.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: prd
      client_id_var: AZURE_CLIENT_ID_PRD
      subscription_id_var: AZURE_SUBSCRIPTION_ID_PRD
